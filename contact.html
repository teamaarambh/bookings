<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact Us — Aarambh</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
    }

    *,*::before,*::after{box-sizing:border-box;font-family:'Montserrat Alternates',sans-serif !important;}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    /* Header */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px;
      background:var(--accent);
      color:var(--bg);
      position:sticky;
      top:0;
      z-index:50;
      box-shadow:0 6px 24px rgba(83,58,90,0.08);
    }
    .brand{display:flex;align-items:center;gap:14px;}
    .brand img{height:56px;}
    .brand h1{font-family:'Cinzel Decorative',serif !important;margin:0;color:var(--bg);font-size:18px;}

    nav{display:flex;gap:20px;align-items:center;}
    nav a{
      color:var(--bg);
      text-decoration:none;
      font-weight:600;
      padding:6px 8px;
      border-radius:8px;
    }
    nav a:hover{background:rgba(255,255,255,0.35);}

    .btn-secondary{
      background:var(--bg);
      color:var(--accent);
      padding:10px 16px;
      border-radius:12px;
      font-weight:700;
      border:2px solid var(--bg);
    }

    /* Mobile nav */
    .nav-toggle{display:none;border:0;background:none;color:white;font-size:22px;}
    @media(max-width:720px){
      .nav-toggle{display:block;}
      nav{
        position:fixed;
        top:64px; right:0;
        width:260px;
        height:calc(100% - 64px);
        background:var(--accent);
        flex-direction:column;
        align-items:flex-start;
        padding:20px;
        gap:14px;
        transform:translateX(100%);
        transition:transform .25s ease;
      }
      nav.open{transform:translateX(0);}
      nav a{width:100%;padding:10px 12px;}
    }

    /* Page Layout */
    .wrap{
      max-width:900px;
      margin:40px auto;
      padding:0 20px;
    }

    h2{
      text-align:center;
      font-family:'Cinzel Decorative',serif !important;
      font-size:34px;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      font-size:18px;
      color:var(--muted);
      margin-bottom:30px;
      font-family:'Pompiere',cursive !important;
      letter-spacing:0.5px;
    }

    .contact-box{
      background:var(--card);
      padding:30px;
      border-radius:14px;
      box-shadow:0 8px 24px rgba(83,58,90,0.10);
      max-width:600px;
      margin:0 auto;
      text-align:center;
    }

    .contact-links{
      display:flex;
      justify-content:center;
      gap:32px;
      margin-top:22px;
    }

    .contact-links a{
      text-decoration:none;
      color:var(--accent);
      transition:opacity .2s ease;
    }
    .contact-links a:hover{opacity:0.75;}

    footer{
      margin-top:50px;
      padding:26px 20px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>

<body>

<div id="site-header"></div>

<script>
  // mobile nav toggle
  const btn = document.querySelector('.nav-toggle');
  const nav = document.querySelector('header nav');
  btn.addEventListener('click',()=>nav.classList.toggle('open'));
  nav.addEventListener('click',e=>{
    if(e.target.tagName==="A") nav.classList.remove('open');
  });
</script>

<div class="wrap">
  <h2>Contact Us</h2>
  <div class="subtitle">We are here to help you with tickets, queries or event info.</div>

  <div class="contact-box">
    <p style="font-size:16px;line-height:1.6;opacity:0.9;">
      Reach out to Team Aarambh through any of the options below.
      We usually respond within minutes.
    </p>

    <!-- MATCHING INDEX ICONS -->
    <div class="contact-links">

      <!-- Phone -->
      <a href="tel:+917700046566">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.1 5.18 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.72 12.4 12.4 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 11a16 16 0 0 0 6 6l1.36-1.18a2 2 0 0 1 2.11-.45 12.4 12.4 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </a>

      <!-- Email -->
      <a href="mailto:tickets.aarambh@gmail.com">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/917700046566" target="_blank">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="var(--accent)">
          <path d="M16.04 3C9.4 3 4 8.4 4 15.04c0 2.64.84 5.12 2.28 7.16L4 29l7.04-2.28c1.96 1.24 4.28 1.96 6.72 1.96 6.64 0 12.04-5.4 12.04-12.04C29.8 8.4 24.4 3 16.04 3zm7.16 17.2c-.28.84-1.64 1.56-2.28 1.64-.6.12-1.36.16-2.2-.12-.52-.16-1.2-.4-2.04-.8-3.56-1.6-5.88-5.24-6.04-5.48-.2-.28-1.44-1.92-1.44-3.64 0-1.72.92-2.56 1.28-2.92.28-.28.76-.4 1.2-.4h.84c.28 0 .64-.08.96.72.28.84.92 2.92 1 3.12.08.2.12.44.04.72-.08.28-.12.44-.24.68-.12.2-.24.36-.36.56-.12.16-.24.36-.12.6.12.28.56 1.36 1.2 2.2.84 1.16 1.52 1.52 1.8 1.68.28.16.44.12.6-.08.16-.2.68-.8.84-1.08.2-.28.36-.24.6-.16.28.08 1.72.84 2 1 .28.12.48.16.56.24.12.08.12.88-.16 1.72z"/>
        </svg>
      </a>

    </div>
  </div>
</div>

<footer>
  © Team Aarambh — All rights reserved
</footer>
<script src="header.js"></script>
</body>
</html>
