<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking Details – Aarambh</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
      authDomain: "aarambh-ticket-bookings.firebaseapp.com",
      databaseURL: "https://aarambh-ticket-bookings-default-rtdb.firebaseio.com",
      projectId: "aarambh-ticket-bookings",
      storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
      messagingSenderId: "269445606104",
      appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
  </script>

  <style>
    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      font-family:'Montserrat Alternates', sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px;
      background:var(--accent);
      color:#fff;
      box-shadow:0 6px 24px rgba(83,58,90,0.08);
      position:sticky;
      top:0;
      z-index:50;
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{height:56px}
    .brand h1{
      margin:0;font-size:18px;font-family:'Cinzel Decorative',serif;color:#fff;
    }
    nav{display:flex;gap:20px}
    nav a{
      color:#fff;
      text-decoration:none;
      font-weight:600;
      padding:6px 10px;
      border-radius:8px;
    }
    nav a:hover{background:rgba(255,255,255,0.25)}

    .wrap{max-width:900px;margin:36px auto;padding:0 20px}
    h2.page-title{
      font-family:'Cinzel Decorative',serif;
      font-size:28px;
      text-align:center;
      color:var(--accent);
    }

    .summary{text-align:center;font-weight:700;margin-bottom:18px;}

    form#bookingForm{
      max-width:360px;
      margin:0 auto;
      background:var(--card);
      padding:20px;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(83,58,90,0.06);
    }

    form input{
      width:100%;
      margin-bottom:12px;
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:15px;
    }

    /* UPDATED BRAND BUTTON */
    form button[type="submit"]{
      width:100%;
      padding:12px;
      background:var(--accent);
      color:#fff;
      font-weight:bold;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }
    form button[type="submit"]:hover{
      opacity:0.90;
      transform:translateY(-2px);
    }

    #formStatus{
      text-align:center;color:#c00;font-weight:bold;margin-top:12px;
    }

    .popup-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.6);
      display:flex;justify-content:center;align-items:center;
      z-index:9999;
    }

    .popup-box{
      background:#fff;
      padding:20px 25px;
      border-radius:10px;
      text-align:center;
      width:90%;
      max-width:330px;
      box-shadow:0 6px 20px rgba(83,58,90,0.12);
    }

    .whatsapp-btn{
      background:#25D366;
      color:#fff;
      padding:10px 15px;
      border-radius:6px;
      text-decoration:none;
      font-weight:bold;
      display:inline-block;
      margin:12px 0;
    }

    .close-btn{
      background:#ccc;
      border:none;
      padding:8px 15px;
      border-radius:6px;
      cursor:pointer;
    }

    footer{
      margin-top:30px;
      padding:20px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="AarambhLogo2.png" alt="logo">
    <div>
      <h1>Aarambh</h1>
      <div style="font-size:12px;color:var(--muted);font-family:'Pompiere';">Where every story begins</div>
    </div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="select-seats.html">Select Seats</a>
  </nav>
</header>

<main class="wrap">
  <h2 class="page-title">Enter Your Details</h2>

  <p class="summary">
    Selected Seats: <span id="selectedSeatsSummary"></span><br>
    Total Price: <span id="totalPriceSummary"></span>
  </p>

  <form id="bookingForm">
    <input type="text" id="userName" placeholder="Your Name" required />
    <input type="tel" id="userWhatsapp" placeholder="WhatsApp Number" required />
    <button type="submit">Pay & Confirm Booking</button>
  </form>

  <p id="formStatus"></p>
</main>

<!-- POPUP -->
<div id="bookingSuccessPopup" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <h3>🎉 Thanks for your booking!</h3>
    <p>Ticket details will be shared on WhatsApp.</p>

    <a href="https://wa.me/917700046566?text=Booking%20done%20on%20portal" target="_blank" class="whatsapp-btn">
      📲 Send WhatsApp Message
    </a>

    <button onclick="closePopup()" class="close-btn">Close</button>
  </div>
</div>

<footer>
  © Team Aarambh — All rights reserved
</footer>

<script type="module">
  import { getFirestore, collection, addDoc } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initializeApp } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
    authDomain: "aarambh-ticket-bookings.firebaseapp.com",
    databaseURL: "https://aarambh-ticket-bookings-default-rtdb.firebaseio.com",
    projectId: "aarambh-ticket-bookings",
    storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
    messagingSenderId: "269445606104",
    appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  /* ✅ READ SESSION STORAGE */
  const selectedSeats = JSON.parse(sessionStorage.getItem("selectedSeats") || "[]");
  const totalPrice = Number(sessionStorage.getItem("totalPrice") || 0);

  /* ✅ GET DOM ELEMENTS EXPLICITLY */
  const selectedSeatsSummary = document.getElementById("selectedSeatsSummary");
  const totalPriceSummary = document.getElementById("totalPriceSummary");
  const bookingForm = document.getElementById("bookingForm");
  const userName = document.getElementById("userName");
  const userWhatsapp = document.getElementById("userWhatsapp");
  const formStatus = document.getElementById("formStatus");
  const bookingSuccessPopup = document.getElementById("bookingSuccessPopup");

  /* ✅ DISPLAY VALUES */
  selectedSeatsSummary.textContent = selectedSeats.length
    ? selectedSeats.join(", ")
    : "None";

  totalPriceSummary.textContent = "₹" + totalPrice;

  bookingForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = userName.value.trim();
    const whatsapp = userWhatsapp.value.trim();

    if (!name || !whatsapp || selectedSeats.length === 0) {
      formStatus.textContent = "🚨 Please fill all details and select seats.";
      return;
    }

    const options = {
      key: "rzp_live_RnmaxEFTzrtmO6",
      amount: totalPrice * 100,
      currency: "INR",
      name: "Aarambh Theatre",
      description: "Ticket Booking",
      prefill: { name, contact: whatsapp },

      handler: async function (response) {
        try {
          await addDoc(collection(db, "bookings"), {
            name,
            whatsapp,
            seats: selectedSeats.join(","),
            amount: totalPrice,
            payment_id: response.razorpay_payment_id,
            timestamp: new Date().toISOString(),
            whatsappSent: false
          });

          bookingSuccessPopup.style.display = "flex";
          sessionStorage.clear();
        } catch (err) {
          alert("❌ Booking save failed: " + err.message);
        }
      },

      modal: {
        ondismiss: () => {
          formStatus.textContent = "Payment cancelled.";
        }
      }
    };

    new Razorpay(options).open();
  });

  window.closePopup = function () {
    bookingSuccessPopup.style.display = "none";
    window.location.href = "index.html";
  };
</script>

</body>
</html>
