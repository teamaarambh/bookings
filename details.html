<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Booking Details – Aarambh</title>

  <!-- Theme + fonts to match index.html -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Firebase SDK (kept as in your original) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
      authDomain: "aarambh-ticket-bookings.firebaseapp.com",
      databaseURL: "https://aarambh-ticket-bookings-default-rtdb.firebaseio.com",
      projectId: "aarambh-ticket-bookings",
      storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
      messagingSenderId: "269445606104",
      appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Save db globally for use in non-module scripts
    window.db = db;
    window.addDoc = addDoc;
    window.collection = collection;
  </script>

  <style>
    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
      --glass: rgba(255,255,255,0.6);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      font-family:'Montserrat Alternates', sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
    }

    /* Header (matching index.html styling) */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px;
      background:var(--accent);
      color:var(--bg);
      position:sticky;
      top:0;
      z-index:50;
      box-shadow:0 6px 24px rgba(83,58,90,0.08);
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{height:56px;display:block}
    .brand h1{font-size:18px;margin:0;color:var(--bg);letter-spacing:0.6px;font-family:'Cinzel Decorative', serif;}
    nav{display:flex;gap:20px;align-items:center}
    nav a{color:var(--bg);text-decoration:none;font-weight:600;padding:6px 8px;border-radius:8px}
    nav a:hover{background:var(--glass);color:var(--bg)}

    .nav-toggle{display:none;background:transparent;border:0;color:var(--bg);font-size:20px;padding:8px;border-radius:8px}

    /* Page wrapper */
    .wrap{max-width:900px;margin:36px auto;padding:0 20px}

    h2.page-title{
      font-family:'Cinzel Decorative', serif;
      color:var(--accent);
      font-size:28px;
      margin:0 0 12px 0;
      text-align:center;
    }

    .summary {
      text-align:center;
      font-weight:700;
      margin-bottom:18px;
      color:var(--text);
    }

    form#bookingForm{
      max-width:360px;
      margin:0 auto 16px;
      background:var(--card);
      padding:20px;
      border-radius:12px;
      box-shadow:0 8px 20px rgba(83,58,90,0.06);
    }

    form input[type="text"],
    form input[type="tel"]{
      width:100%;
      margin-bottom:12px;
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
      font-family:'Montserrat Alternates',sans-serif;
      font-size:15px;
    }

    form button[type="submit"]{
      width:100%;
      padding:12px;
      background:#ff4b2b;
      color:#fff;
      font-weight:700;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }
    form button[type="submit"]:hover{opacity:0.95; transform:translateY(-1px);}

    #formStatus{ text-align:center;color:#c00;font-weight:700;margin-top:12px; }

    /* Popup overlay (retained functionality but styled to match site) */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .popup-box {
      background: var(--bg);
      padding: 20px 25px;
      border-radius: 10px;
      text-align: center;
      max-width: 360px;
      width: 92%;
      box-shadow: 0 6px 20px rgba(83,58,90,0.12);
      color:var(--text);
    }
    .whatsapp-btn {
      display: inline-block;
      margin: 12px 0;
      padding: 10px 15px;
      background: #25D366;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
    }
    .whatsapp-btn:hover { background:#1ebe5d; }

    .close-btn {
      background: #ccc;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-top:8px;
    }
    .close-btn:hover { background:#bbb; }

    footer{
      margin-top:30px;
      padding:18px 20px;
      text-align:center;
      color:var(--muted);
    }

    @media(max-width:720px){
      header{padding:12px 16px}
      .brand img{height:48px}
      .wrap{margin:20px auto}
      .nav-toggle{display:inline-flex}
    }
  </style>
</head>

<body>
  <!-- Header (visual only; links match your site) -->
  <header>
    <div class="brand">
      <img src="AarambhLogo2.png" alt="Aarambh logo">
      <div>
        <h1 style="margin:0;font-family:'Cinzel Decorative',serif;">Aarambh</h1>
        <div style="font-size:12px;color:var(--muted);font-weight:700;font-family:'Pompiere',cursive;">Where every story begins</div>
      </div>
    </div>

    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="select-seats.html">Select Seats</a>
      <a href="https://wa.me/917700046566" target="_blank">Contact</a>
    </nav>
  </header>

  <main class="wrap" role="main">
    <h2 class="page-title">Enter Your Details</h2>

    <p class="summary">
      Selected Seats: <span id="selectedSeatsSummary"></span><br>
      Total Price: <span id="totalPriceSummary"></span>
    </p>

    <form id="bookingForm" novalidate>
      <input type="text" id="userName" placeholder="Your Name" required />
      <input type="tel" id="userWhatsapp" placeholder="WhatsApp Number" required />
      <button type="submit">Pay &amp; Confirm Booking</button>
    </form>

    <p id="formStatus"></p>
  </main>

  <!-- Booking Success Popup -->
  <div id="bookingSuccessPopup" class="popup-overlay" style="display:none;">
    <div class="popup-box">
      <h3 style="margin:0 0 8px 0">🎉 Thanks for your booking!</h3>
      <p style="margin:0 0 12px 0">Ticket details will be shared on WhatsApp.</p>
      <a id="waLink" href="https://wa.me/917700046566?text=Booking%20done%20on%20portal" target="_blank" class="whatsapp-btn">📲 Send WhatsApp Message</a>
      <div>
        <button onclick="closePopup()" class="close-btn">Close</button>
      </div>
    </div>
  </div>

  <footer>
    <div style="max-width:900px;margin:0 auto;padding:6px 8px;text-align:center">
      <div style="margin-bottom:6px;font-weight:700;color:var(--accent)">Contact</div>
      <div style="margin-bottom:6px;color:var(--muted)">© Team Aarambh — All rights reserved</div>
    </div>
  </footer>

  <script type="module">
    // Exactly the same booking logic you provided — only formatting changed outside this block.
    const selectedSeats = JSON.parse(sessionStorage.getItem("selectedSeats") || "[]");
    const totalPrice = parseInt(sessionStorage.getItem("totalPrice") || "0");

    document.getElementById("selectedSeatsSummary").textContent = selectedSeats.join(", ");
    document.getElementById("totalPriceSummary").textContent = "₹" + totalPrice;

    const form = document.getElementById("bookingForm");
    const statusEl = document.getElementById("formStatus");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("userName").value.trim();
      const whatsapp = document.getElementById("userWhatsapp").value.trim();

      if (!name || !whatsapp || selectedSeats.length === 0) {
        statusEl.textContent = "🚨 Please fill all details and select seats.";
        return;
      }

      // Razorpay payment options
      const options = {
        key: "rzp_live_RnmaxEFTzrtmO6", // Replace with your Razorpay key
        amount: totalPrice * 100,
        currency: "INR",
        name: "Aarambh Theatre",
        description: "Ticket Booking",
        prefill: { name, contact: whatsapp },
        handler: async function (response) {
          try {
            const bookingData = {
              name,
              whatsapp,
              seats: selectedSeats.join(","),
              payment_id: response.razorpay_payment_id,
              timestamp: new Date().toISOString()
            };

            // Save booking to Firebase Firestore
            await window.addDoc(window.collection(window.db, "bookings"), bookingData);
            console.log("Booking saved successfully");

            // Show popup
            document.getElementById("bookingSuccessPopup").style.display = "flex";
            sessionStorage.clear();
          } catch (err) {
            console.error("Save error:", err);
            alert("❌ Booking save failed: " + err.message);
          }
        },
        modal: {
          ondismiss: () => {
            statusEl.textContent = "Payment cancelled.";
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    });

    window.closePopup = function() {
      document.getElementById("bookingSuccessPopup").style.display = "none";
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
