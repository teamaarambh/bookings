<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Select Seats – Aarambh</title>

  <!-- Brand Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;500;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      font-family:'Montserrat Alternates',sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    /* HEADER (matching index.html) */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px;
      background:var(--accent);
      color:#fff;
      position:sticky;
      top:0;
      z-index:50;
      box-shadow:0 6px 24px rgba(83,58,90,0.08);
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{height:56px}
    .brand h1{
      margin:0;
      font-size:18px;
      letter-spacing:.5px;
      font-family:'Cinzel Decorative',serif;
      color:#fff;
    }
    nav{display:flex;gap:20px}
    nav a{
      color:#fff;
      text-decoration:none;
      font-weight:600;
      padding:6px 10px;
      border-radius:8px;
    }
    nav a:hover{
      background:rgba(255,255,255,0.25);
    }

    /* CONTAINER */
    .wrap{
      max-width:1000px;
      margin:40px auto;
      padding:0 20px;
    }

    h2{
      font-family:'Cinzel Decorative',serif;
      font-size:30px;
      text-align:center;
      color:var(--accent);
      margin-top:0;
    }

    .info{
      text-align:center;
      font-weight:700;
      margin-bottom:10px;
    }

    /* STAGE */
    .stage-banner{
      background:var(--accent);
      color:#fff;
      font-weight:600;
      padding:10px 0;
      border-radius:8px;
      margin:18px auto;
      max-width:300px;
      text-align:center;
    }

    /* SEAT MAP CARD */
    .seat-map{
      background:var(--card);
      border-radius:14px;
      padding:20px 10px;
      box-shadow:0 10px 30px rgba(83,58,90,0.10);
      overflow-x:auto;
      margin-bottom:20px;
    }

    .seat-layout{
      display:flex;
      gap:12px;
      min-width:880px;
      justify-content:center;
    }

    .division{display:flex;flex-direction:column;gap:6px}

    .row{display:flex;gap:4px;justify-content:center}

    .seat{
      width:16px;
      height:16px;
      border-radius:3px;
      border:1px solid #888;
      cursor:pointer;
      transition:0.2s ease;
    }

    .premium{background:#f39c12;border-color:#d67d00;}
    .economy{background:#3498db;border-color:#217dbb;}
    .booked{background:#7f8c8d !important;border-color:#626a6b !important;cursor:not-allowed;}
    .selected{background:#2ecc71 !important;border-color:#27ae60 !important;outline:2px solid #27ae60;}

    /* LEGEND */
    .seat-legend{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      margin-bottom:20px;
      font-size:14px;
    }
    .legend-item{
      display:flex;
      align-items:center;
      gap:6px;
    }
    .seat-icon{
      width:14px;height:14px;border-radius:3px;border:1px solid #888;
    }
    .seat-icon.premium{background:#f39c12;border-color:#d67d00}
    .seat-icon.economy{background:#3498db;border-color:#217dbb}
    .seat-icon.booked{background:#7f8c8d;border-color:#626a6b}
    .seat-icon.selected{background:#2ecc71;border-color:#27ae60}

    /* BUTTON */
    #continueBtn{
      display:block;
      margin:20px auto;
      padding:14px 26px;
      font-weight:700;
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:18px;
      box-shadow:0 6px 20px rgba(83,58,90,0.12);
    }
    #continueBtn:hover{
      transform:translateY(-2px);
      opacity:.95;
    }

    footer{
      margin-top:30px;
      padding:20px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    @media(max-width:600px){
      .seat{width:14px;height:14px}
      #continueBtn{width:100%;font-size:16px}
    }
  </style>

  <!-- Firebase SDK (unchanged logic) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
      authDomain: "aarambh-ticket-bookings.firebaseapp.com",
      databaseURL: "https://aarambh-ticket-bookings-default-rtdb.firebaseio.com",
      projectId: "aarambh-ticket-bookings",
      storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
      messagingSenderId: "269445606104",
      appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let bookedSeats = new Set();
    let selectedSeats = [];
    let totalPrice = 0;

    const middleRows = [...Array(18)].map((_, i) => String.fromCharCode(65 + i));
    const middleCols = Array.from({ length: 15 }, (_, i) => i + 1);

    async function fetchBookedSeats() {
      const querySnapshot = await getDocs(collection(db, "bookings"));
      const allSeats = [];
      querySnapshot.forEach(doc => {
        const seats = doc.data().seats || "";
        if (seats) seats.split(",").forEach(s => allSeats.push(s.trim()));
      });
      bookedSeats = new Set(allSeats);
    }

    function createSeat(section, rowLabel, seatNum) {
      const seatId = `${section}${rowLabel}${seatNum}`;
      const isPremium = section === "M" && rowLabel >= "A" && rowLabel <= "H";
      const price = isPremium ? 500 : 300;

      const seat = document.createElement("div");
      seat.classList.add("seat", isPremium ? "premium" : "economy");
      seat.dataset.seatId = seatId;
      seat.dataset.price = price;

      if (bookedSeats.has(seatId)) {
        seat.classList.add("booked");
        return seat;
      }

      seat.addEventListener("click", () => {
        if (selectedSeats.includes(seatId)) {
          selectedSeats = selectedSeats.filter(s => s !== seatId);
          totalPrice -= price;
          seat.classList.remove("selected");
        } else {
          selectedSeats.push(seatId);
          totalPrice += price;
          seat.classList.add("selected");
        }
        updateInfo();
      });

      return seat;
    }

    function updateInfo() {
      document.getElementById("selectedSeats").textContent =
        "Selected Seats: " + (selectedSeats.length ? selectedSeats.join(", ") : "None");
      document.getElementById("totalPrice").textContent =
        "Total Price: ₹" + totalPrice;
    }

    async function renderSeats() {
      await fetchBookedSeats();

      const seatMap = document.getElementById("seatMap");
      seatMap.textContent = "";

      const layoutWrapper = document.createElement("div");
      layoutWrapper.className = "seat-layout";

      const leftDiv = document.createElement("div");
      leftDiv.className = "division left";

      const middleDiv = document.createElement("div");
      middleDiv.className = "division middle";

      const rightDiv = document.createElement("div");
      rightDiv.className = "division right";

      middleRows.forEach((rowLabel, rowIndex) => {
        const sideSeats = Math.min(2 + rowIndex, 9);

        const leftRow = document.createElement("div");
        leftRow.classList.add("row");
        for (let i = 1; i <= sideSeats; i++) {
          leftRow.appendChild(createSeat("L", rowLabel, i));
        }
        leftDiv.appendChild(leftRow);

        const middleRow = document.createElement("div");
        middleRow.classList.add("row");
        middleCols.forEach(col => {
          middleRow.appendChild(createSeat("M", rowLabel, col));
        });
        middleDiv.appendChild(middleRow);

        const rightRow = document.createElement("div");
        rightRow.classList.add("row");
        for (let i = 1; i <= sideSeats; i++) {
          rightRow.appendChild(createSeat("R", rowLabel, i));
        }
        rightDiv.appendChild(rightRow);
      });

      layoutWrapper.append(leftDiv, middleDiv, rightDiv);
      seatMap.appendChild(layoutWrapper);
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderSeats();

      document.getElementById("continueBtn").addEventListener("click", () => {
        if (selectedSeats.length === 0) {
          alert("Please select at least one seat to continue.");
          return;
        }
        sessionStorage.setItem("selectedSeats", JSON.stringify(selectedSeats));
        sessionStorage.setItem("totalPrice", totalPrice);
        window.location.href = "details.html";
      });
    });
  </script>

</head>

<body>

<header>
  <div class="brand">
    <img src="AarambhLogo2.png" alt="Aarambh Logo">
    <div>
      <h1>Aarambh</h1>
      <div style="font-size:12px;color:var(--muted);font-family:'Pompiere';">Where every story begins</div>
    </div>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="details.html">Details</a>
  </nav>
</header>

<div class="wrap">
  <h2>Select Your Seats</h2>

  <div class="info" id="selectedSeats">Selected Seats: None</div>
  <div class="info" id="totalPrice">Total Price: ₹0</div>

  <div class="stage-banner">🎭 STAGE</div>

  <div class="seat-map" id="seatMap">Loading seat map…</div>

  <div class="seat-legend">
    <div class="legend-item"><div class="seat-icon premium"></div> Premium (₹500)</div>
    <div class="legend-item"><div class="seat-icon economy"></div> Economy (₹300)</div>
    <div class="legend-item"><div class="seat-icon booked"></div> Booked</div>
    <div class="legend-item"><div class="seat-icon selected"></div> Selected</div>
  </div>

  <button id="continueBtn">Continue</button>
</div>

<footer>
  © Team Aarambh — All rights reserved
</footer>

</body>
</html>
