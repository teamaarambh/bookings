<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • Manual Booking Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat Alternates',sans-serif;
  background:#f6f2eb;
  color:#533A5A;
}
.wrap{
  max-width:520px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#ffffff;
  padding:24px;
  border-radius:14px;
}
h2{text-align:center;margin-top:0}
label{
  display:block;
  margin-top:14px;
  font-size:13px;
  font-weight:600;
}
input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  margin-top:22px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#533A5A;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.success{color:#27ae60;margin-top:14px;text-align:center}
.error{color:#c0392b;margin-top:14px;text-align:center}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">
    <h2>Manual Booking Entry</h2>

    <form id="entryForm">

      <label>Name</label>
      <input id="name" required>

      <label>WhatsApp</label>
      <input id="whatsapp" required placeholder="+91 9876543210">

      <label>Seats</label>
      <input id="seats" placeholder="A1, A2, B10">

      <label>Amount</label>
      <input id="amount" type="number" required>

      <label>Payment ID</label>
      <input id="payment_id">

      <label>Reference Name</label>
      <input id="referenceName">

      <label>Timestamp</label>
      <input id="timestamp">

      <button type="submit">Save Entry</button>

      <div id="msg"></div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* Firebase */
const app = initializeApp({
  apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
  authDomain: "aarambh-ticket-bookings.firebaseapp.com",
  projectId: "aarambh-ticket-bookings",
  appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
});
const db = getFirestore(app);

/* DOM */
const form = document.getElementById("entryForm");
const msg = document.getElementById("msg");

const nameInput = document.getElementById("name");
const whatsappInput = document.getElementById("whatsapp");
const seatsInput = document.getElementById("seats");
const amountInput = document.getElementById("amount");
const paymentIdInput = document.getElementById("payment_id");
const referenceInput = document.getElementById("referenceName");
const timestampInput = document.getElementById("timestamp");

/* Default timestamp */
timestampInput.value = new Date().toISOString();

/* Helpers */
function normalizeWhatsapp(raw){
  const d = raw.replace(/\D/g,"");
  if (d.length === 10) return d;
  if (d.length === 12 && d.startsWith("91")) return d.slice(2);
  return null;
}

function normalizeAndSortSeats(raw){
  return raw.split(",")
    .map(s => s.trim().toUpperCase())
    .filter(Boolean)
    .sort((a,b)=>{
      const [,r1,n1] = a.match(/^([A-Z]+)(\d+)$/) || [];
      const [,r2,n2] = b.match(/^([A-Z]+)(\d+)$/) || [];
      if(!r1 || !r2) return a.localeCompare(b);
      return r1===r2 ? n1-n2 : r1.localeCompare(r2);
    })
    .join(", ");
}

/* Submit */
form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  msg.textContent="";
  msg.className="";

  const cleanWhatsapp = normalizeWhatsapp(whatsappInput.value);
  if(!cleanWhatsapp){
    msg.textContent="❌ Invalid WhatsApp number";
    msg.className="error";
    return;
  }

  const data = {
    name: nameInput.value.trim(),
    whatsapp: cleanWhatsapp,
    seats: normalizeAndSortSeats(seatsInput.value),
    amount: Number(amountInput.value),
    payment_id: paymentIdInput.value.trim(),
    referenceName: referenceInput.value.trim(),
    timestamp: timestampInput.value.trim()
  };

  try{
    await addDoc(collection(db,"bookings"), data);
    msg.textContent="✅ Entry saved successfully";
    msg.className="success";
    form.reset();
    timestampInput.value=new Date().toISOString();
  }catch(err){
    console.error(err);
    msg.textContent="❌ "+err.message;
    msg.className="error";
  }
});
</script>

</body>
</html>
