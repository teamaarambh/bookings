<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • Manual Booking Entry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat Alternates',sans-serif;
  background:#f6f2eb;
  color:#533A5A;
}
.wrap{
  max-width:520px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#ffffff;
  padding:24px;
  border-radius:14px;
}
h2{margin-top:0}
label{
  display:block;
  margin-top:14px;
  font-size:13px;
  font-weight:600;
}
input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  margin-top:22px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#533A5A;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.success{color:#27ae60;margin-top:14px}
.error{color:#c0392b;margin-top:14px}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2>Manual Booking Entry</h2>

    <label>Name</label>
    <input id="name">

    <label>WhatsApp Number</label>
    <input id="whatsapp" placeholder="10-digit number">

    <label>Amount</label>
    <input id="amount" type="number">

    <label>Payment ID</label>
    <input id="payment_id">

    <label>Reference Name</label>
    <input id="referenceName">

    <label>Timestamp</label>
    <input id="timestamp">

    <button id="saveBtn">Save Entry</button>

    <div id="msg"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* Firebase — SAME PROJECT */
const app = initializeApp({
  apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
  authDomain: "aarambh-ticket-bookings.firebaseapp.com",
  projectId: "aarambh-ticket-bookings",
  appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
});

const db = getFirestore(app);

/* Default timestamp = NOW (STRING) */
timestamp.value = new Date().toISOString();

saveBtn.onclick = async () => {
  msg.textContent = "";
  msg.className = "";

  const data = {
    name: name.value.trim(),
    whatsapp: whatsapp.value.trim(),
    amount: Number(amount.value || 0),
    payment_id: payment_id.value.trim(),
    referenceName: referenceName.value.trim(),
    timestamp: timestamp.value.trim()   // STRING, NOT serverTimestamp
  };

  if (!data.name || !data.whatsapp) {
    msg.textContent = "Name and WhatsApp are required";
    msg.className = "error";
    return;
  }

  try{
    await addDoc(collection(db,"bookings"), data);
    msg.textContent = "Booking saved successfully";
    msg.className = "success";

    name.value="";
    whatsapp.value="";
    amount.value="";
    payment_id.value="";
    referenceName.value="";
    timestamp.value=new Date().toISOString();
  }catch(e){
    msg.textContent = "Failed to save entry";
    msg.className = "error";
  }
};
</script>
</body>
</html>
