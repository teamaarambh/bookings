<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • WhatsApp Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat Alternates',sans-serif;
  background:#f6f2eb;
  color:#533A5A;
}
.wrap{max-width:900px;margin:40px auto;padding:20px}
.card{background:#fff;padding:24px;border-radius:16px}
h2{text-align:center;margin-top:0}

label{display:block;margin-top:16px;font-weight:600;font-size:14px}
textarea,input,select{
  width:100%;
  margin-top:6px;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  font-size:13px;
}
th{background:#533A5A;color:white}
tr:nth-child(even){background:#f6f2eb}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  background:#25D366;
  color:white;
  font-weight:700;
  cursor:pointer;
  font-size:12px;
}

.status-sent{color:green;font-weight:700}
.status-pending{color:#c0392b;font-weight:700}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:14px;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2>WhatsApp Message Sender</h2>

    <label>Message</label>
    <textarea id="messageInput" rows="6"
      placeholder="🎭 Drama Night 2.0 🎟️&#10;&#10;We’re back with an all-new edition!"></textarea>

    <label>PDF Attachment</label>
    <input type="file" id="pdfInput" accept="application/pdf">

    <label>Upload CSV / TXT (Name, Mobile)</label>
    <input type="file" id="nameNumberFile" accept=".csv,.txt">

    <!-- SEARCH -->
    <input id="globalSearch" placeholder="Search name / mobile / status" style="margin-top:16px">

    <!-- FILTERS -->
    <div class="filters">
      <input id="filterName" placeholder="Filter Name">
      <input id="filterMobile" placeholder="Filter Mobile">
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Sent">Sent</option>
      </select>
    </div>

    <table id="listTable" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Mobile</th>
          <th>Status</th>
          <th>Send</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>

  </div>
</div>

<script>
const messageInput = document.getElementById("messageInput");
const pdfInput = document.getElementById("pdfInput");
const nameNumberFile = document.getElementById("nameNumberFile");
const listBody = document.getElementById("listBody");
const listTable = document.getElementById("listTable");

const globalSearch = document.getElementById("globalSearch");
const filterName = document.getElementById("filterName");
const filterMobile = document.getElementById("filterMobile");
const filterStatus = document.getElementById("filterStatus");

let rowsData = [];

/* Normalize Indian mobile numbers */
function normalize(num){
  const d = num.replace(/\D/g,"");
  if(d.length === 10) return "91" + d;
  if(d.length === 12 && d.startsWith("91")) return d;
  return null;
}

function formatMessage(msg){
  return msg.replace(/\n/g,"%0A");
}

function openPDFOnce(){
  if(pdfInput.files[0]){
    window.open(URL.createObjectURL(pdfInput.files[0]),"_blank");
  }
}

/* Load file */
nameNumberFile.onchange = async () => {
  rowsData = [];
  listBody.innerHTML="";
  listTable.style.display="none";

  const text = await nameNumberFile.files[0].text();
  const lines = text.replace(/\uFEFF/g,"").split(/\r?\n/).filter(Boolean);

  lines.forEach(line=>{
    const [name,mobileRaw] = line.split(",");
    const mobile = normalize(mobileRaw || "");
    if(!mobile) return;

    rowsData.push({
      name: name?.trim() || "-",
      mobile,
      status:"Pending"
    });
  });

  renderTable();
};

function renderTable(){
  listBody.innerHTML="";
  listTable.style.display="table";

  rowsData.forEach((r,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${i+1}</td>
      <td>${r.name}</td>
      <td>${r.mobile}</td>
      <td class="${r.status==="Sent"?"status-sent":"status-pending"}">${r.status}</td>
      <td><button onclick="sendRow(${i})">Send</button></td>
    `;
    listBody.appendChild(tr);
  });

  applyFilters();
}

function sendRow(index){
  if(!messageInput.value){ alert("Enter message first"); return; }

  openPDFOnce();
  const msg = formatMessage(messageInput.value);
  window.open(`https://wa.me/${rowsData[index].mobile}?text=${msg}`,"_blank");

  rowsData[index].status="Sent";
  renderTable();
}

/* FILTERS + SEARCH */
function applyFilters(){
  const g = globalSearch.value.toLowerCase();
  const fn = filterName.value.toLowerCase();
  const fm = filterMobile.value.toLowerCase();
  const fs = filterStatus.value;

  [...listBody.rows].forEach((tr,i)=>{
    const r = rowsData[i];
    let show=true;

    if(g && !(`${r.name}${r.mobile}${r.status}`.toLowerCase().includes(g))) show=false;
    if(fn && !r.name.toLowerCase().includes(fn)) show=false;
    if(fm && !r.mobile.includes(fm)) show=false;
    if(fs && r.status!==fs) show=false;

    tr.style.display = show ? "" : "none";
  });
}

[globalSearch,filterName,filterMobile,filterStatus].forEach(el=>{
  el.oninput=applyFilters;
});
</script>
</body>
</html>
