<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • Bulk WhatsApp Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat Alternates',sans-serif;
  background:#f6f2eb;
  color:#533A5A;
}
.wrap{max-width:620px;margin:40px auto;padding:20px}
.card{background:#fff;padding:24px;border-radius:16px}
h2{text-align:center;margin-top:0}

label{display:block;margin-top:16px;font-weight:600;font-size:14px}
textarea,input{
  width:100%;
  margin-top:6px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:22px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#25D366;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.progress{
  margin-top:16px;
  font-size:14px;
}

/* Preview modal */
#previewModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
#previewCard{
  background:#ece5dd;
  padding:18px;
  border-radius:14px;
  max-width:420px;
  width:90%;
  font-family:Arial, sans-serif;
}
.chat-bubble{
  background:#dcf8c6;
  padding:10px 12px;
  border-radius:8px;
  margin-top:10px;
  white-space:pre-wrap;
  font-size:14px;
  line-height:1.4;
  box-shadow:0 1px 1px rgba(0,0,0,.1);
}
.preview-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:16px;
}
.preview-actions button{
  width:auto;
  padding:8px 12px;
  border-radius:6px;
  font-weight:700;
}
.cancel{background:#999}
.confirm{background:#25D366}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2>Bulk WhatsApp Sender</h2>

    <label>Upload Mobile Numbers (CSV / TXT)</label>
    <input type="file" id="fileInput" accept=".csv,.txt">

    <label>Message</label>
    <textarea id="messageInput" rows="6" placeholder="Type WhatsApp message here"></textarea>

    <label>PDF Attachment</label>
    <input type="file" id="pdfInput" accept="application/pdf">

    <button id="startBtn">Preview & Send</button>

    <div class="progress" id="progress"></div>
  </div>
</div>

<!-- CHAT PREVIEW MODAL -->
<div id="previewModal">
  <div id="previewCard">
    <h3 style="margin-top:0">WhatsApp Preview</h3>
    <p style="font-size:13px;margin:0 0 8px">
      Sending to <b><span id="previewCount"></span></b> recipients
    </p>

    <div class="chat-bubble" id="previewText"></div>

    <div class="preview-actions">
      <button class="cancel" onclick="closePreview()">Cancel</button>
      <button class="confirm" onclick="confirmSend()">Confirm & Send</button>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const messageInput = document.getElementById("messageInput");
const pdfInput = document.getElementById("pdfInput");
const startBtn = document.getElementById("startBtn");
const progress = document.getElementById("progress");

let queuedNumbers = [];

/* Normalize Indian numbers */
function normalize(num){
  const d = num.replace(/\D/g,"");
  if(d.length === 10) return "91"+d;
  if(d.length === 12 && d.startsWith("91")) return d;
  return null;
}

/* Preview step */
startBtn.onclick = async () => {
  if(!fileInput.files[0] || !messageInput.value){
    alert("Upload numbers and enter message");
    return;
  }

  const text = await fileInput.files[0].text();
  const numbers = text
    .split(/\r?\n/)
    .map(l => normalize(l))
    .filter(Boolean);

  if(numbers.length === 0){
    alert("No valid numbers found");
    return;
  }

  queuedNumbers = numbers;
  document.getElementById("previewCount").textContent = numbers.length;
  document.getElementById("previewText").textContent = messageInput.value;
  document.getElementById("previewModal").style.display = "flex";
};

function closePreview(){
  document.getElementById("previewModal").style.display = "none";
}

/* Confirm & send */
async function confirmSend(){
  closePreview();

  // Open PDF once (user attaches manually)
  if(pdfInput.files[0]){
    const pdfURL = URL.createObjectURL(pdfInput.files[0]);
    window.open(pdfURL, "_blank");
  }

  for(let i=0;i<queuedNumbers.length;i++){
    progress.textContent = `Sending ${i+1} / ${queuedNumbers.length}`;
      const msg = messageInput.value.normalize("NFC");
const url = `https://wa.me/${queuedNumbers[i]}?text=${encodeURIComponent(msg)}`;
    window.open(url, "_blank");
    await new Promise(r => setTimeout(r, 1200));
  }

  progress.textContent = "Done ✅";
}
</script>
</body>
</html>
