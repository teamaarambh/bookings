<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • WhatsApp Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Montserrat Alternates',sans-serif;
  background:#f6f2eb;
  color:#533A5A;
}
.wrap{max-width:800px;margin:40px auto;padding:20px}
.card{background:#fff;padding:24px;border-radius:16px}
h2{text-align:center;margin-top:0}

label{display:block;margin-top:16px;font-weight:600;font-size:14px}
textarea,input{
  width:100%;
  margin-top:6px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  font-size:14px;
}
th{background:#533A5A;color:white}
tr:nth-child(even){background:#f6f2eb}

button{
  padding:6px 12px;
  border:none;
  border-radius:8px;
  background:#25D366;
  color:white;
  font-weight:700;
  cursor:pointer;
  font-size:12px;
}

.section{
  border:1px dashed #ccc;
  padding:16px;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2>WhatsApp Message Sender</h2>

    <label>Message (use system emoji picker)</label>
    <textarea id="messageInput" rows="8"
      placeholder="🎭 Drama Night 2.0 🎟️&#10;&#10;We’re back with an all-new edition!"></textarea>

    <label>PDF Attachment</label>
    <input type="file" id="pdfInput" accept="application/pdf">

    <!-- OPTION 1 -->
    <div class="section">
      <h3>Option 1 — Numbers Only (Send WhatsApp)</h3>
      <input type="file" id="numbersFile" accept=".csv,.txt">
      <button onclick="sendFromNumbersFile()">Send WhatsApp to All Numbers</button>
    </div>

    <!-- OPTION 2 -->
    <div class="section">
      <h3>Option 2 — Name + Number (Display on Page)</h3>
      <input type="file" id="nameNumberFile" accept=".csv,.txt">

      <table id="listTable" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Send</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const messageInput = document.getElementById("messageInput");
const pdfInput = document.getElementById("pdfInput");
const numbersFile = document.getElementById("numbersFile");
const nameNumberFile = document.getElementById("nameNumberFile");
const listBody = document.getElementById("listBody");
const listTable = document.getElementById("listTable");

/* Normalize Indian numbers */
function normalize(num){
  const d = num.replace(/\D/g,"");
  if(d.length === 10) return "91" + d;
  if(d.length === 12 && d.startsWith("91")) return d;
  return null;
}

/* Encode line breaks for WhatsApp */
function formatMessage(msg){
  return msg.replace(/\n/g, "%0A");
}

/* Open PDF once (manual attach) */
function openPDFOnce(){
  if(pdfInput.files[0]){
    const pdfURL = URL.createObjectURL(pdfInput.files[0]);
    window.open(pdfURL, "_blank");
  }
}

/* OPTION 1 — Numbers only */
async function sendFromNumbersFile(){
  if(!numbersFile.files[0]){
    alert("Upload numbers-only file");
    return;
  }
  if(!messageInput.value){
    alert("Enter message first");
    return;
  }

  const text = await numbersFile.files[0].text();
  const numbers = text
    .replace(/\uFEFF/g,"")
    .split(/[\n,]/)
    .map(v => normalize(v.trim()))
    .filter(Boolean);

  if(numbers.length === 0){
    alert("No valid numbers found");
    return;
  }

  openPDFOnce();

  const msg = formatMessage(messageInput.value);
  numbers.forEach(num => {
    window.open(`https://wa.me/${num}?text=${msg}`, "_blank");
  });
}

/* OPTION 2 — Name + Number (Display) */
nameNumberFile.onchange = async () => {
  listBody.innerHTML = "";
  listTable.style.display = "none";

  if(!nameNumberFile.files[0]) return;

  const text = await nameNumberFile.files[0].text();
  const rows = text
    .replace(/\uFEFF/g,"")
    .split(/\r?\n/)
    .map(r => r.trim())
    .filter(Boolean);

  let count = 0;

  rows.forEach(row => {
    const [name, mobileRaw] = row.split(",");
    const mobile = normalize(mobileRaw || "");
    if(!mobile) return;

    count++;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${count}</td>
      <td>${name?.trim() || "-"}</td>
      <td>${mobile}</td>
      <td>
        <button onclick="sendSingle('${mobile}')">Send</button>
      </td>
    `;
    listBody.appendChild(tr);
  });

  if(count === 0){
    alert("No valid name+number rows found");
    return;
  }

  listTable.style.display = "table";
};

/* Send single (from table) */
function sendSingle(mobile){
  if(!messageInput.value){
    alert("Enter message first");
    return;
  }

  openPDFOnce();
  const msg = formatMessage(messageInput.value);
  window.open(`https://wa.me/${mobile}?text=${msg}`, "_blank");
}
</script>
</body>
</html>
