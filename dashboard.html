<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#533A5A;
  --muted:#EEB885;
  --bg:#ffffff;
  --card:#EADFC8;
  --text:#533A5A;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Montserrat Alternates',sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1100px;margin:40px auto;padding:0 20px}
.card{
  background:var(--card);
  border-radius:14px;
  padding:28px;
  box-shadow:0 10px 30px rgba(83,58,90,0.08);
}
h2{
  font-family:'Cinzel Decorative',serif;
  margin:0 0 20px;
  color:var(--accent);
  text-align:center;
}
input{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  width:100%;
  max-width:360px;
}
button{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:700;
  cursor:pointer;
}
button:hover{opacity:.9}

/* TABLE */
.table-wrap{width:100%;overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  background:white;
  margin-top:20px;
  table-layout:fixed;
}
th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  font-size:14px;
  vertical-align:top;
}
th{
  background:var(--accent);
  color:white;
  text-align:left;
}
tr:nth-child(even){background:#f6f2eb}

/* Column widths */
th:nth-child(1), td:nth-child(1){width:16%}
th:nth-child(2), td:nth-child(2){width:16%}
th:nth-child(3), td:nth-child(3){width:30%}
th:nth-child(4), td:nth-child(4){width:6%;text-align:center}
th:nth-child(5), td:nth-child(5){width:14%}
th:nth-child(6), td:nth-child(6){width:10%}
th:nth-child(7), td:nth-child(7){width:8%}

/* Seat grouping badges */
.seat-groups{display:flex;flex-wrap:wrap;gap:6px}
.seat-group{
  background:var(--accent);
  color:white;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
}

/* Wrapping */
td:nth-child(3),
td:nth-child(5),
td:nth-child(6),
td:nth-child(7){
  white-space:normal;
  word-break:break-word;
}

.date-block{line-height:1.3}
.date-block .date{font-weight:600}
.date-block .time{font-size:12px;opacity:.8}

.center{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginView" class="center">
  <div class="card" style="max-width:420px;text-align:center">
    <h2>🔐 Admin Login</h2>
    <input id="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button id="loginBtn">Login</button>
    <p id="loginError" style="color:#c0392b;margin-top:10px"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardView" style="display:none">
  <div class="wrap">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <h2>🎟️ Aarambh Bookings</h2>
        <div>
          <button id="exportBtn">⬇ Export CSV</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>

      <input id="searchInput" placeholder="Search bookings…">

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>WhatsApp</th>
              <th>Seats (Grouped)</th>
              <th>Qty</th>
              <th>Payment ID</th>
              <th>Date</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="bookingsBody">
            <tr><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
  authDomain: "aarambh-ticket-bookings.firebaseapp.com",
  projectId: "aarambh-ticket-bookings",
  storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
  messagingSenderId: "269445606104",
  appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user=>{
  loginView.style.display = user ? "none" : "flex";
  dashboardView.style.display = user ? "block" : "none";
  if(user) loadBookings();
});

loginBtn.onclick = ()=>signInWithEmailAndPassword(auth,email.value,password.value).catch(e=>loginError.textContent=e.message);
logoutBtn.onclick = ()=>signOut(auth);

/* Seat grouping */
function groupSeats(seats){
  const groups = {};
  seats.forEach(s=>{
    const m = s.match(/R(\d+)C(\d+)/i);
    if(!m) return;
    const r = "R"+m[1];
    const c = "C"+m[2];
    groups[r] = groups[r] || [];
    groups[r].push(c);
  });
  return groups;
}

function formatGroups(groups){
  return Object.entries(groups)
    .map(([r,cs])=>`${r}: ${cs.join(", ")}`)
    .join(" | ");
}

async function loadBookings(){
  const body=document.getElementById("bookingsBody");
  body.innerHTML="";
  const snap=await getDocs(collection(db,"bookings"));

  snap.forEach(doc=>{
    const b=doc.data();
    const seats = typeof b.seats==="string"
      ? b.seats.split(",").map(s=>s.trim()).filter(Boolean)
      : Array.isArray(b.seats)?b.seats:[];
    const grouped=groupSeats(seats);
    const groupedText=formatGroups(grouped);

    const badges = Object.entries(grouped)
      .map(([r,cs])=>`<span class="seat-group">${r}: ${cs.join(", ")}</span>`)
      .join("");

    const d = b.timestamp ? new Date(b.timestamp) : null;

    body.innerHTML+=`
      <tr data-export='${JSON.stringify({
        name:b.name||"",
        whatsapp:b.whatsapp||"",
        seats:groupedText,
        qty:seats.length,
        payment:b.payment_id||"",
        date:d?d.toLocaleDateString():"",
        time:d?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):""
      })}'>
        <td>${b.name||""}</td>
        <td>${b.whatsapp||""}</td>
        <td><div class="seat-groups">${badges}</div></td>
        <td>${seats.length}</td>
        <td>${b.payment_id||""}</td>
        <td>${d?d.toLocaleDateString():""}</td>
        <td>${d?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):""}</td>
      </tr>`;
  });
}

/* Search */
searchInput.onkeyup=()=>{
  const f=searchInput.value.toLowerCase();
  [...bookingsBody.rows].forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(f)?"":"none";
  });
};

/* EXPORT */
exportBtn.onclick=()=>{
  let csv=["Name,WhatsApp,Seats,Seat Count,Payment ID,Date,Time"];
  [...bookingsBody.rows].forEach(r=>{
    const d=JSON.parse(r.dataset.export);
    csv.push(`"${d.name}","${d.whatsapp}","${d.seats}",${d.qty},"${d.payment}","${d.date}","${d.time}"`);
  });
  const blob=new Blob([csv.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="aarambh-bookings.csv";
  a.click();
};
</script>

</body>
</html>
