<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarambh • Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#533A5A;
  --bg:#ffffff;
  --card:#EADFC8;
  --text:#533A5A;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat Alternates',sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1300px;margin:40px auto;padding:0 20px}
.card{background:var(--card);border-radius:16px;padding:28px}
h2{font-family:'Cinzel Decorative',serif;margin:0}

input{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;max-width:420px}
button{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:white;font-weight:700;cursor:pointer}
button.wa{background:#25D366}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0}
.stat{background:white;padding:16px 22px;border-radius:12px}
.stat .label{font-size:12px;opacity:.7}
.stat .value{font-size:26px;font-weight:800}

table{width:100%;border-collapse:collapse;margin-top:20px;background:white}
th,td{padding:10px;border-bottom:1px solid #ddd;font-size:14px}
th{background:var(--accent);color:white;text-align:left}
tr:nth-child(even){background:#f6f2eb}

.seat-badge{background:var(--accent);color:white;padding:4px 8px;border-radius:6px;font-size:12px}
.wa-btn{background:#25D366;color:white;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700}
.status-sent{color:green;font-weight:700}
.status-pending{color:#888}

.center{display:flex;justify-content:center;align-items:center;min-height:100vh}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
.modal-card{background:white;padding:22px;border-radius:14px;max-width:520px;width:90%}
.modal pre{background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
</style>
</head>

<body>

<div id="loginView" class="center">
  <div class="card" style="max-width:420px;text-align:center">
    <h2>🔐 Admin Login</h2><br>
    <input id="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button id="loginBtn">Login</button>
    <p id="loginError" style="color:#c0392b"></p>
  </div>
</div>

<div id="dashboardView" style="display:none">
  <div class="wrap">
    <div class="card">

      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <h2>🎟 Aarambh Bookings</h2>
        <div>
          <button id="bulkWhatsAppBtn" class="wa">📤 Send WhatsApp</button>
          <button id="exportBtn">⬇ Export CSV</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat">
          <div class="label">Total Tickets</div>
          <div class="value" id="totalQty">0</div>
        </div>
        <div class="stat">
          <div class="label">Total Amount</div>
          <div class="value">₹<span id="totalAmount">0</span></div>
        </div>
      </div>

      <input id="searchInput" placeholder="Search…">

      <table>
        <thead>
          <tr>
            <th></th>
            <th>Name</th>
            <th>WhatsApp</th>
            <th>Seats</th>
            <th>Qty</th>
            <th>Amount</th>
            <th>Payment ID</th>
            <th>Date</th>
            <th>Send</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>

    </div>
  </div>
</div>

<div id="previewModal" class="modal">
  <div class="modal-card">
    <h3>WhatsApp Preview</h3>
    <pre id="previewText"></pre>
    <div class="modal-actions">
      <button onclick="previewModal.style.display='none'">Cancel</button>
      <button class="wa" onclick="confirmSend()">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
  authDomain: "aarambh-ticket-bookings.firebaseapp.com",
  projectId: "aarambh-ticket-bookings",
  appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
});

const auth = getAuth(app);
const db = getFirestore(app);

let previewQueue=[];

onAuthStateChanged(auth,u=>{
  loginView.style.display=u?"none":"flex";
  dashboardView.style.display=u?"block":"none";
  if(u) loadBookings();
});

loginBtn.onclick=()=>signInWithEmailAndPassword(auth,email.value,password.value).catch(e=>loginError.textContent=e.message);
logoutBtn.onclick=()=>signOut(auth);

/* SEAT SORT + GROUP */
function normalizeSeats(raw){
  const list=(Array.isArray(raw)?raw:raw.split(","))
    .map(s=>s.trim())
    .filter(Boolean)
    .sort((a,b)=>{
      const r=a.match(/([A-Z]+)(\d+)/);
      const s=b.match(/([A-Z]+)(\d+)/);
      return r[1]===s[1]?+r[2]-+s[2]:r[1].localeCompare(s[1]);
    });
  return list;
}

function buildMessage(name,seats){
  return `Hello ${name}

Warm greetings from Team Aarambh!

Seats: ${seats.join(", ")}
Date: 16 Jan 2026
Time: 6:30 – 8:30 PM
Venue: Symbiosis College Auditorium
https://maps.app.goo.gl/27cv4kFw84Zgnjc67

— Team Aarambh`;
}

async function loadBookings(){
  bookingsBody.innerHTML="";
  let qty=0, amt=0;

  const q=query(collection(db,"bookings"),orderBy("timestamp","desc"));
  const snap=await getDocs(q);

  snap.forEach(d=>{
    const b=d.data();
    const seats=normalizeSeats(b.seats||[]);
    qty+=seats.length;
    amt+=Number(b.amount||0);

    bookingsBody.innerHTML+=`
<tr>
<td><input type="checkbox" class="rowCheck" data-id="${d.id}" data-phone="${b.whatsapp}" data-name="${b.name}" data-seats="${seats.join(",")}"></td>
<td>${b.name||""}</td>
<td>${b.whatsapp||""}</td>
<td><span class="seat-badge">${seats.join(", ")}</span></td>
<td>${seats.length}</td>
<td>₹${b.amount||0}</td>
<td>${b.payment_id||""}</td>
<td>${b.timestamp?.toDate().toLocaleString()||""}</td>
<td><button class="wa-btn" onclick="previewSingle('${d.id}')">Send</button></td>
<td>${b.whatsappSent?"✔ Sent":"Pending"}</td>
</tr>`;
  });

  totalQty.textContent=qty;
  totalAmount.textContent=amt;
}

window.previewSingle=id=>{
  const cb=document.querySelector(`.rowCheck[data-id="${id}"]`);
  previewQueue=[{
    id,
    phone:cb.dataset.phone,
    message:buildMessage(cb.dataset.name,cb.dataset.seats.split(","))
  }];
  previewText.textContent=previewQueue[0].message;
  previewModal.style.display="flex";
};

window.confirmSend=async()=>{
  previewModal.style.display="none";
  for(const p of previewQueue){
    window.open(`https://wa.me/91${p.phone}?text=${encodeURIComponent(p.message)}`);
    await updateDoc(doc(db,"bookings",p.id),{whatsappSent:true,whatsappSentAt:serverTimestamp()});
  }
  loadBookings();
};
</script>

</body>
</html>
