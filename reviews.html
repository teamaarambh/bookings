<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aarambh — Reviews</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after{font-family:inherit!important;box-sizing:border-box}

    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
      --glass: rgba(255,255,255,0.6);
    }

    html,body{
      margin:0;
      font-family:'Montserrat Alternates',sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.45;
    }

    /* ===== HEADER (EXACT COPY FROM INDEX) ===== */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 28px;
      background:var(--accent);
      color:var(--bg);
      position:sticky;
      top:0;
      z-index:50;
      box-shadow:0 6px 24px rgba(83,58,90,0.08);
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{height:56px;display:block}
    .brand h1{
      font-size:18px;
      margin:0;
      color:var(--bg);
      font-family:'Cinzel Decorative',serif;
    }
    nav{display:flex;gap:20px;align-items:center}
    nav a{
      color:var(--bg);
      text-decoration:none;
      font-weight:600;
      padding:6px 8px;
      border-radius:8px;
    }
    nav a:hover{background:var(--glass)}

    .btn-secondary{
      background:var(--bg);
      color:var(--accent);
      padding:10px 16px;
      border-radius:12px;
      font-weight:700;
      text-decoration:none;
    }

    .nav-toggle{display:none;background:none;border:0;color:var(--bg);font-size:20px}

    @media(max-width:720px){
      .nav-toggle{display:inline-flex}
      nav{
        position:fixed;
        right:0;
        top:64px;
        background:var(--accent);
        width:260px;
        height:calc(100% - 64px);
        flex-direction:column;
        padding:20px;
        transform:translateX(100%);
        transition:.25s ease;
      }
      nav.open{transform:translateX(0)}
    }

    /* ===== PAGE ===== */
    .wrap{
      max-width:900px;
      margin:44px auto;
      padding:0 20px;
    }

    .card{
      background:var(--card);
      border-radius:16px;
      padding:28px;
      box-shadow:0 10px 30px rgba(83,58,90,0.08);
      margin-bottom:30px;
    }

    h2{
      font-family:'Cinzel Decorative',serif;
      text-align:center;
      margin:0 0 18px;
      color:var(--accent);
    }

    input,select,textarea{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,.15);
      margin-bottom:14px;
      font-family:inherit;
    }

    textarea{min-height:100px}

    button{
      width:100%;
      background:var(--accent);
      color:var(--bg);
      border:none;
      padding:14px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
    }

    .review{
      border-bottom:1px solid rgba(0,0,0,.1);
      padding:14px 0;
    }
    .review:last-child{border-bottom:none}
    .review .name{font-weight:800;color:var(--accent)}
    .review .stars{color:#f5b301;font-size:14px}
    .review .text{font-size:14px;opacity:.9}

    /* ===== FOOTER (EXACT COPY FROM INDEX) ===== */
    footer{
      margin-top:40px;
      padding:26px 20px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <img src="AarambhLogo2.png" alt="Aarambh logo">
    <div>
      <h1>Aarambh</h1>
      <div style="font-size:12px;color:var(--muted);font-family:'Pompiere'">
        Where every story begins
      </div>
    </div>
  </div>

  <button class="nav-toggle">☰</button>

  <nav>
    <a href="index.html">Home</a>
    <a href="team.html">Team Aarambh</a>
    <a href="contact.html">Contact Us</a>
    <a href="reviews.html" style="background:var(--glass)">Reviews</a>
    <a class="btn-secondary" href="select-seats.html">Book Tickets</a>
  </nav>
</header>

<!-- CONTENT -->
<main class="wrap">

  <section class="card">
    <h2>Leave a Review</h2>

    <input type="text" placeholder="Your name">
    <select>
      <option>★★★★★ (5)</option>
      <option>★★★★☆ (4)</option>
      <option>★★★☆☆ (3)</option>
      <option>★★☆☆☆ (2)</option>
      <option>★☆☆☆☆ (1)</option>
    </select>
    <textarea placeholder="Write your review..."></textarea>
    <button>Submit Review</button>
  </section>

  <section class="card">
    <h2>Customer Reviews</h2>

    <div class="review">
      <div class="name">Sample User</div>
      <div class="stars">★★★★★</div>
      <div class="text">Amazing experience!</div>
    </div>

  </section>

</main>

<!-- FOOTER -->
<footer>
  © Team Aarambh — All rights reserved
</footer>

<script>
(function(){
  const btn=document.querySelector('.nav-toggle');
  const nav=document.querySelector('nav');
  btn.onclick=()=>nav.classList.toggle('open');
})();
</script>

</body>
</html>
