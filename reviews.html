<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aarambh — Reviews</title>

  <!-- Google Fonts (EXACT SAME AS INDEX) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <!-- Shared Header CSS -->
  <link rel="stylesheet" href="header.css">

  <style>
    /* FORCE FONT INHERITANCE — MATCH INDEX.HTML */
    *, *::before, *::after { font-family: inherit !important; box-sizing: border-box; }

    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
      --glass: rgba(255,255,255,0.6);
    }

    html, body{
      margin:0;
      font-family:'Montserrat Alternates', sans-serif !important;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
    }

    h1,h2,h3{
      font-family:'Cinzel Decorative', serif !important;
      color:var(--accent);
    }

    .wrap{
      max-width:900px;
      margin:44px auto;
      padding:0 20px;
    }

    .card{
      background:var(--card);
      border-radius:16px;
      padding:28px;
      box-shadow:0 10px 30px rgba(83,58,90,0.08);
      margin-bottom:30px;
    }

    .review-form input,
    .review-form textarea,
    .review-form select{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.15);
      margin-bottom:14px;
      font-size:14px;
    }

    .review-form textarea{ min-height:110px; resize:vertical; }

    .submit-btn{
      width:100%;
      background:var(--accent);
      color:var(--bg);
      border:none;
      padding:14px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
    }

    .submit-btn:hover{ opacity:.95 }

    .review{
      padding:16px 0;
      border-bottom:1px solid rgba(0,0,0,0.1);
    }
    .review:last-child{ border-bottom:none }

    .review-name{
      font-weight:800;
      color:var(--accent);
    }

    .review-stars{
      color:#f5b301;
      font-size:14px;
      margin:4px 0;
    }

    .review-text{
      font-size:14px;
      opacity:.9;
    }

    .review-date{
      font-size:12px;
      opacity:.6;
      margin-top:4px;
    }

    footer{
      margin-top:40px;
      padding:26px 20px;
      text-align:center;
      color:var(--muted);
    }
  </style>
</head>

<body>

<!-- SHARED HEADER -->
<div id="site-header"></div>

<main class="wrap">

  <!-- SUBMIT REVIEW -->
  <section class="card">
    <h2 style="text-align:center;margin-top:0">Leave a Review</h2>

    <form class="review-form" id="reviewForm">
      <input id="name" type="text" placeholder="Your name" required>

      <select id="rating" required>
        <option value="">Rating</option>
        <option value="5">★★★★★ (5)</option>
        <option value="4">★★★★☆ (4)</option>
        <option value="3">★★★☆☆ (3)</option>
        <option value="2">★★☆☆☆ (2)</option>
        <option value="1">★☆☆☆☆ (1)</option>
      </select>

      <textarea id="review" placeholder="Write your review..." required></textarea>

      <button class="submit-btn" type="submit">Submit Review</button>
    </form>
  </section>

  <!-- REVIEWS LIST -->
  <section class="card">
    <h2 style="text-align:center;margin-top:0">Customer Reviews</h2>
    <div id="reviewsList"></div>
  </section>

</main>

<footer>
  © Team Aarambh — All rights reserved
</footer>

<!-- SHARED HEADER LOADER -->
<script src="header.js"></script>

<!-- FIREBASE + REVIEWS -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
    authDomain: "aarambh-ticket-bookings.firebaseapp.com",
    projectId: "aarambh-ticket-bookings",
    storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
    messagingSenderId: "269445606104",
    appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("reviewForm");
  const reviewsList = document.getElementById("reviewsList");

  const stars = r => "★".repeat(r) + "☆".repeat(5 - r);

  async function loadReviews(){
    reviewsList.innerHTML = "";

    const q = query(collection(db,"reviews"), orderBy("createdAt","desc"));
    const snap = await getDocs(q);

    snap.forEach(doc=>{
      const r = doc.data();
      const div = document.createElement("div");
      div.className = "review";
      div.innerHTML = `
        <div class="review-name">${r.name}</div>
        <div class="review-stars">${stars(r.rating)}</div>
        <div class="review-text">${r.review}</div>
        <div class="review-date">
          ${r.createdAt?.toDate().toLocaleDateString()}
        </div>
      `;
      reviewsList.appendChild(div);
    });
  }

  form.addEventListener("submit", async e=>{
    e.preventDefault();

    await addDoc(collection(db,"reviews"),{
      name: name.value.trim(),
      rating: Number(rating.value),
      review: review.value.trim(),
      createdAt: serverTimestamp()
    });

    form.reset();
    loadReviews();
  });

  loadReviews();
</script>

</body>
</html>
