<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aarambh — Reviews</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@300;400;600;700&family=Pompiere&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <!-- Shared Header CSS -->
  <link rel="stylesheet" href="header.css">

  <style>
    *, *::before, *::after{font-family:inherit !important;box-sizing:border-box}

    :root{
      --accent:#533A5A;
      --muted:#EEB885;
      --bg:#FFFFFF;
      --card:#EADFC8;
      --text:#533A5A;
      --glass: rgba(255,255,255,0.6);
    }

    html,body{
      margin:0;
      font-family:'Montserrat Alternates',sans-serif !important;
      background:var(--bg);
      color:var(--text);
      line-height:1.45;
    }

    h1,h2,h3{
      font-family:'Cinzel Decorative',serif !important;
      color:var(--accent);
    }

    .wrap{max-width:900px;margin:44px auto;padding:0 20px}

    .card{
      background:var(--card);
      border-radius:16px;
      padding:28px;
      box-shadow:0 10px 30px rgba(83,58,90,0.08);
      margin-bottom:30px;
    }

    label{font-weight:700;margin-top:10px;display:block}

    input,textarea,select{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.15);
      margin-top:6px;
      margin-bottom:14px;
      font-size:14px;
    }

    textarea{min-height:110px;resize:vertical}

    .submit-btn{
      width:100%;
      background:var(--accent);
      color:var(--bg);
      border:none;
      padding:14px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
    }

    .submit-btn:disabled{opacity:.6;cursor:not-allowed}

    .review{padding:16px 0;border-bottom:1px solid rgba(0,0,0,0.1)}
    .review:last-child{border-bottom:none}

    .review-name{font-weight:800;color:var(--accent)}
    .review-text{font-size:14px;opacity:.9;margin-top:6px}
    .play-rating{font-size:13px;margin-top:4px}
    .review-date{font-size:12px;opacity:.6;margin-top:6px}

    footer{margin-top:40px;padding:26px 20px;text-align:center;color:var(--muted)}
  </style>
</head>

<body>

<!-- SHARED HEADER -->
<div id="site-header"></div>

<main class="wrap">

  <!-- SUBMIT REVIEW -->
  <section class="card">
    <h2 style="text-align:center;margin-top:0">Leave a Review</h2>

    <form id="reviewForm">

      <label>Your Name</label>
      <input id="name" type="text" placeholder="Your name" required>

      <label>Overall Review</label>
      <textarea id="review" placeholder="Share your overall experience..." required></textarea>

      <!-- OPTIONAL PLAY RATINGS -->
      <label>Kahaani Thodi Filmy Hai (optional)</label>
      <select id="play1">
        <option value="">No rating</option>
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
      </select>

      <label>Humsafar Express (optional)</label>
      <select id="play2">
        <option value="">No rating</option>
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
      </select>

      <label>Jaldi Kar Panvel Nikalna Hai (optional)</label>
      <select id="play3">
        <option value="">No rating</option>
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
      </select>

      <button class="submit-btn" id="submitBtn" type="submit">
        Submit Review
      </button>
    </form>
  </section>

  <!-- REVIEWS LIST -->
  <section class="card">
    <h2 style="text-align:center;margin-top:0">Customer Reviews</h2>
    <div id="reviewsList"></div>
  </section>

</main>

<footer>
  © Team Aarambh — All rights reserved
</footer>

<!-- TOAST -->
<div id="toast" style="
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:var(--bg);
  padding:14px 22px;
  border-radius:14px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  box-shadow:0 10px 30px rgba(83,58,90,0.25);
"></div>

<script src="header.js"></script>

<script>
  function showToast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg;
    t.style.opacity="1";
    setTimeout(()=>t.style.opacity="0",2500);
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyCz5-f1FZMxcfs2yc29hXNLz9636Q2jjKg",
    authDomain: "aarambh-ticket-bookings.firebaseapp.com",
    projectId: "aarambh-ticket-bookings",
    storageBucket: "aarambh-ticket-bookings.firebasestorage.app",
    messagingSenderId: "269445606104",
    appId: "1:269445606104:web:4ee4beecee2d77cd5f45ad"
  });

  const db = getFirestore(app);

  const stars = n => "⭐".repeat(n);

  async function loadReviews(){
    const list=document.getElementById("reviewsList");
    list.innerHTML="";
    const q=query(collection(db,"reviews"),orderBy("createdAt","desc"));
    const snap=await getDocs(q);

    snap.forEach(doc=>{
      const r=doc.data();
      let plays="";
      if(r.playRatings?.kahaani) plays+=`<div class="play-rating">Kahaani Thodi Filmy Hai: ${stars(r.playRatings.kahaani)}</div>`;
      if(r.playRatings?.humsafar) plays+=`<div class="play-rating">Humsafar Express: ${stars(r.playRatings.humsafar)}</div>`;
      if(r.playRatings?.panvel) plays+=`<div class="play-rating">Jaldi Kar Panvel Nikalna Hai: ${stars(r.playRatings.panvel)}</div>`;

      list.innerHTML+=`
        <div class="review">
          <div class="review-name">${r.name}</div>
          <div class="review-text">${r.review}</div>
          ${plays}
          <div class="review-date">${r.createdAt?.toDate().toLocaleDateString()}</div>
        </div>`;
    });
  }

  document.getElementById("reviewForm").addEventListener("submit",async e=>{
    e.preventDefault();

    const playRatings={};
    const p1=+play1.value, p2=+play2.value, p3=+play3.value;
    if(p1) playRatings.kahaani=p1;
    if(p2) playRatings.humsafar=p2;
    if(p3) playRatings.panvel=p3;

    await addDoc(collection(db,"reviews"),{
      name:name.value.trim(),
      review:review.value.trim(),
      playRatings,
      createdAt:serverTimestamp()
    });

    localStorage.setItem("lastReviewTime",Date.now());
    e.target.reset();
    loadReviews();
    showToast("Review submitted successfully 🎉");
  });

  loadReviews();
</script>

</body>
</html>
